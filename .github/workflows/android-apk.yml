name: Build Music Finder APK

on:
  push:
    paths:
      - "tiktok-music/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiktok-music/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        # ponów przy chwilowych problemach z pobieraniem bibliotek
        run: gradle assembleDebug --no-daemon || (sleep 20 && gradle assembleDebug --no-daemon) || (sleep 60 && gradle assembleDebug --no-daemon)
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MusicFinder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFinder-apk
          path: tiktok-music/android/MusicFinder.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: music-finder-${{ github.run_number }}
          name: "Music Finder (Android) nr ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: tiktok-music/android/MusicFinder.apk
          body: |
            Aplikacja Music Finder na Androida.
            Otwórz tę stronę na telefonie, pobierz **MusicFinder.apk** i zainstaluj
            (zezwól przeglądarce na instalowanie aplikacji z nieznanych źródeł).
            Działa samodzielnie — bez serwera i bez komputera.
