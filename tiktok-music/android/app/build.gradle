plugins { id 'com.android.application' }

android {
    namespace 'pl.musicfinder'
    compileSdk 34
    defaultConfig {
        applicationId 'pl.musicfinder'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // Adres serwera można wbudować przy budowaniu: -PserverUrl=https://...
        buildConfigField 'String', 'DEFAULT_SERVER', "\"${project.findProperty('serverUrl') ?: ''}\""
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
