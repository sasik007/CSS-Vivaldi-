plugins { id 'com.android.application' }

android {
    namespace 'pl.musicfinder'
    compileSdk 34
    defaultConfig {
        applicationId 'pl.musicfinder'
        minSdk 24
        targetSdk 34
        versionCode 26
        versionName '4.9'
    }
    // Stały klucz podpisu — dzięki niemu nowe wersje instalują się jako aktualizacja.
    // (Klucz tylko do tej prywatnej aplikacji, nie do Sklepu Play.)
    signingConfigs {
        debug {
            storeFile file('musicfinder.keystore')
            storePassword 'musicfinder'
            keyAlias 'musicfinder'
            keyPassword 'musicfinder'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
